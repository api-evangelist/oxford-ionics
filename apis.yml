name: Oxford Ionics
description: 'Oxford Ionics is a quantum computing hardware company founded in Oxford, UK that
  designs and builds trapped-ion quantum computers powered by its proprietary Electronic Qubit
  Control (EQC) technology, which uses integrated semiconductor chips rather than lasers to
  control qubits. The company holds published records across single-qubit gate fidelity,
  two-qubit gate fidelity, and state preparation/measurement, and builds compact,
  field-upgradeable, data-center-ready QPUs that fit standard server racks and integrate with
  AWS and NVIDIA stacks. Its roadmap targets 16-64 qubits (2025), 256+ qubits (2026), and
  10,000+ qubits (2027). Oxford Ionics was acquired by IonQ in 2025. As of this profile the
  company publishes no public developer API, SDKs, MCP server, or API documentation surface.'
